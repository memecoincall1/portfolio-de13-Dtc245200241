server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1) Log stdout/stderr của mọi Docker container (Nginx, App, DB...)
  - job_name: docker-containers
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
      - json:
          expressions:
            stream: stream
            log: log
            time: time
      - timestamp:
          source: time
          format: RFC3339Nano
      - labels:
          stream:
      - output:
          source: log
    # Gắn nhãn container name từ đường dẫn file
    relabel_configs:
      - source_labels: [__path__]
        regex: /var/lib/docker/containers/(?P<id>[a-f0-9]{64})/.*\.log
        target_label: container_id

  # 2) Log file Nginx (share volume nginx_logs)
  - job_name: nginx-access
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx-access
          service: nginx
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      - regex:
          expression: '^(?P<remote>[0-9a-fA-F\.:]+) - (?P<user>\S+) \[(?P<time>[^\]]+)\] "(?P<method>\S+) (?P<path>\S+) \S+" (?P<status>\d+) (?P<bytes>\d+) "[^"]*" "(?P<ua>[^"]*)".*$'
      - labels:
          method:
          status:
          path:
      - timestamp:
          source: time
          format: '02/Jan/2006:15:04:05 -0700'

  - job_name: nginx-error
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx-error
          service: nginx
          __path__: /var/log/nginx/error.log
