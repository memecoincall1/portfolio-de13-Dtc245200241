# Đề 13 — Nginx reverse proxy: / → http://app:3000, /phpmyadmin/ → http://phpmyadmin:80/
# NOTE: KHÔNG định nghĩa lại `log_format main` ở đây vì image nginx:1.27-alpine
# đã định nghĩa sẵn `log_format main` trong /etc/nginx/nginx.conf.
# Định nghĩa lại gây lỗi: [emerg] duplicate "log_format" name "main" → container Restarting loop.
# access_log bên dưới tái sử dụng format `main` có sẵn đó.

server {
  listen 80;
  listen [::]:80;
  server_name _;

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # ── Security headers (tiêu chí Hardening) ──
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
  server_tokens off;

  client_max_body_size 10m;

  # Healthcheck cho docker compose (không log để khỏi nhiễu Loki)
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain always;
    return 200 'ok';
  }

  # ── phpMyAdmin (lưu ý trailing slash để app tạo link đúng) ──
  location /phpmyadmin/ {
    proxy_pass http://phpmyadmin:80/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
  }
  # /phpmyadmin (không slash) → chuyển về có slash cho đúng PMA_ABSOLUTE_URI
  location = /phpmyadmin {
    return 301 /phpmyadmin/;
  }

  # ── Portfolio app ──
  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
  }
}
