# De 13: Portfolio + MySQL + Nginx + Prometheus/Grafana + Loki/Promtail
# Chay: cp .env.example .env -> docker compose up -d --build
# Web: http://localhost/ | phpMyAdmin: http://localhost/phpmyadmin/
# Grafana: http://localhost:3001 | Prometheus: http://localhost:9090
name: portfolio-de13

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-app
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:?set-in-.env}:${MYSQL_PASSWORD:?set-in-.env}@db:3306/${MYSQL_DATABASE:?set-in-.env}
    expose: ["3000"]
    depends_on:
      db: {condition: service_healthy}
    networks: [frontend-net, backend-net]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}
        reservations: {cpus: "0.25", memory: 128M}
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: mysql:8.0
    container_name: portfolio-db
    restart: unless-stopped
    env_file: [.env]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set-in-.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set-in-.env}
      MYSQL_USER: ${MYSQL_USER:?set-in-.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set-in-.env}
    command: [--default-authentication-plugin=mysql_native_password,--character-set-server=utf8mb4,--collation-server=utf8mb4_unicode_ci]
    volumes: [mysql_data:/var/lib/mysql, ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro]
    expose: ["3306"]
    networks: [backend-net]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}
        reservations: {cpus: "0.25", memory: 256M}
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    container_name: portfolio-phpmyadmin
    restart: unless-stopped
    env_file: [.env]
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      PMA_ABSOLUTE_URI: http://localhost/phpmyadmin/
    expose: ["80"]
    depends_on:
      db: {condition: service_healthy}
    networks: [backend-net, frontend-net]
    deploy:
      resources:
        limits: {cpus: "0.50", memory: 256M}
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

  nginx:
    image: nginx:1.27-alpine
    container_name: portfolio-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
      - phpmyadmin
    networks: [frontend-net]
    deploy:
      resources:
        limits: {cpus: "0.50", memory: 256M}
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: portfolio-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose: ["9090"]
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    networks: [monitoring-net]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: portfolio-node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    expose: ["9100"]
    ports: ["9100:9100"]
    networks: [monitoring-net]
    deploy:
      resources:
        limits: {cpus: "0.30", memory: 128M}

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: portfolio-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose: ["8080"]
    ports: ["8080:8080"]
    networks: [monitoring-net]
    deploy:
      resources:
        limits: {cpus: "0.50", memory: 512M}

  grafana:
    image: grafana/grafana:11.2.0
    container_name: portfolio-grafana
    restart: unless-stopped
    env_file: [.env]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?set-in-.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    expose: ["3000"]
    ports: ["${GRAFANA_PORT:-3001}:3000"]
    depends_on: [prometheus, loki]
    networks: [monitoring-net]
    deploy:
      resources:
        limits: {cpus: "0.50", memory: 512M}

  loki:
    image: grafana/loki:2.9.8
    container_name: portfolio-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    expose: ["3100"]
    ports: ["3100:3100"]
    networks: [monitoring-net]
    deploy:
      resources:
        limits: {cpus: "0.50", memory: 512M}

  promtail:
    image: grafana/promtail:2.9.8
    container_name: portfolio-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx_logs:/var/log/nginx:ro
    depends_on: [loki]
    networks: [monitoring-net]
    deploy:
      resources:
        limits: {cpus: "0.30", memory: 256M}

networks:
  frontend-net: {driver: bridge}
  backend-net: {driver: bridge, internal: true}
  monitoring-net: {driver: bridge}

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:
  nginx_logs:
